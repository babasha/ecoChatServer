[phases.setup]
nixPkgs = ["curl"]

[phases.install]
cmds = [
  "curl -L https://go.dev/dl/go1.23.4.linux-amd64.tar.gz -o go.tar.gz",
  "tar -C /usr/local -xzf go.tar.gz"
]

[phases.build]
cmds = [
  "cd ecochatserver && /usr/local/go/bin/go mod download && /usr/local/go/bin/go build -o bin/ecochatserver ."
]

[start]
cmd = "cd ecochatserver && ./bin/ecochatserver"
